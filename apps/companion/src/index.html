<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Achievements Companion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button class="pet-shell drag" id="pet" aria-label="展开 Agent 成就">
      <span class="aura"><i class="eye left"></i><i class="eye right"></i><i class="smile"></i></span>
      <span class="spark one">✦</span><span class="spark two">·</span>
      <span class="status-dot"></span>
      <strong id="agentName">Agent 醒着</strong>
      <small id="petHint">点我看看今天的成就</small>
    </button>

    <section class="panel" id="panel" aria-hidden="true">
      <header class="drag">
        <div><small>AGENT COMPANION</small><h1 id="panelAgent">你的 Agent 正在工作</h1></div>
        <button class="no-drag close" id="close" aria-label="收起">×</button>
      </header>
      <div class="mood"><span>✦</span><p id="taskSummary">等待任务状态…</p></div>
      <div class="section-title"><span>正在追踪</span><small>主动目标</small></div>
      <div id="tracked" class="cards"></div>
      <div class="section-title"><span>最近获得</span><small>人的认可</small></div>
      <div id="awards" class="cards"></div>
      <footer>规则与正确性，永远比成就优先。</footer>
    </section>

    <script src="renderer.js"></script>
  </body>
</html>
