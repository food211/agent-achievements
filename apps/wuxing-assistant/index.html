<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15201c" />
    <title>五行 Harness</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="masthead">
        <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><span>克</span></div>
        <div class="brand-copy"><small>WUXING AGENT HARNESS</small><h1>五行 Harness</h1><p>给 AI 的规则做一次代谢</p></div>
        <button id="themeToggle" class="quiet-button" type="button">浅色</button>
      </header>

      <section class="hero">
        <div><span class="eyebrow">这次审查</span><h2>规则还在，事实已经往前走了。</h2><p>Harness 对照规则、代码、测试和运行记录，把冲突带到你面前。你决定以后，它才会覆盖旧规则。</p></div>
        <div class="metrics" id="metrics" aria-label="审查统计"></div>
      </section>

      <section class="control-map" aria-label="五行 Harness 当前实现">
        <div><span class="node fire">火</span><b>执行结果</b><small>推翻旧规则</small></div>
        <i>克</i>
        <div><span class="node metal">金</span><b>人的判断</b><small>批准或砍掉方案</small></div>
        <i>克</i>
        <div><span class="node wood">木</span><b>修改方案</b><small>只留下合适的分支</small></div>
        <div class="water-stop"><span class="node water">水</span><b>现实影响先叫停</b><small>自动任务和数据同步先问人</small></div>
      </section>

      <section class="audit-layout">
        <aside class="findings-panel">
          <div class="section-head"><div><small>待你判断</small><h2>发现的问题</h2></div><button id="resetDemo" class="quiet-button">重新演示</button></div>
          <div id="findingList" class="finding-list"></div>
        </aside>

        <article class="detail-panel" id="detailPanel">
          <div class="empty-state"><b>选一条发现</b><p>先看证据，再决定规则要不要改。</p></div>
        </article>
      </section>

      <footer>
        <p><b>这次只做三条克线。</b>完整非阻塞任务队列、木克土、土克水和旺衰诊断还没有做。</p>
        <a href="https://github.com/food211/agent-achievements" target="_blank" rel="noreferrer">安装 Skill</a>
      </footer>
    </main>
  </body>
</html>
